name: gtm
version: "1.0.0"
config-version: 2
profile: gtm

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  gtm:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    eval:
      +materialized: table
      +schema: eval
    dq:
      +materialized: view
      +schema: dq
    marts:
      +materialized: table
      +schema: marts
