version: 2

models:
  - name: int_accounts__deduped_v1
    description: Frozen dedup-rule-v1. Same domain always merges. Used only to keep v1 eval numbers beside v2.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: master_account_id
        data_tests: [not_null]

  - name: int_accounts__deduped
    description: >
      Account to surviving billing entity. A shared website domain merges only when countries
      are compatible (null matches anything) and neither ParentId points at the other.
      Otherwise normalized name, unchanged from v1. Survivor is the earliest CreatedDate.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: master_account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__account')
                field: account_id
      - name: match_rule
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['website', 'name']

  - name: int_accounts__hierarchy
    description: Ultimate corporate parent via ParentId. Distinct from the billing-entity master.
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__account')
                field: account_id
      - name: ultimate_parent_account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__account')
                field: account_id

  - name: int_fx__daily_rates
    description: >
      Dated conversion rate expanded to a date spine. conversion_rate is local currency units per 1 USD.
      Bookings convert on CloseDate; billings convert on the invoice created date.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - rate_date
              - currency_code
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: conversion_rate
        data_tests: [not_null]

  - name: int_quote_to_cash
    description: One row per order. Opportunity synced quote to order quote, plus invoices matched onto the order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__order')
                field: order_id
      - name: master_account_id
        data_tests: [not_null]
      - name: quote_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__quote')
                field: quote_id
      - name: synced_quote_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__quote')
                field: quote_id

  - name: int_orders__billing_schedule
    description: >
      One expected invoice slot per order. Slot starts are EffectiveDate plus k billing periods,
      through the earlier of EndDate and today. Recurring amounts are reduction-adjusted;
      one-time items land on slot 0 only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - slot_start
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__order')
                field: order_id
      - name: slot_start
        data_tests: [not_null]
      - name: expected_amount
        data_tests: [not_null]
      - name: master_account_id
        data_tests: [not_null]

  - name: int_invoices__to_order
    description: >
      Every invoice linked to an order. Metadata wins. Otherwise a 1:1 match to a billing-schedule
      slot, an API-COMMIT overage term, or a reduction-order credit.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__order')
                field: order_id
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metadata', 'fuzzy_schedule', 'fuzzy_overage', 'fuzzy_credit', 'unmatched']

  - name: int_invoices__unmatched
    description: Invoices with no metadata order and no schedule, overage, or credit match.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['unmatched']
