version: 2

sources:
  - name: salesforce
    description: Salesforce objects landed as CSV by the synthetic connector. API field names are verbatim.
    meta:
      external_location: "{{ var('data_dir', env_var('GTM_DATA_DIR', flags.LOG_PATH.rsplit('/logs', 1)[0] ~ '/../data')) }}/raw/salesforce/{name}.csv"
    tables:
      - name: user
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: dated_conversion_rate
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: product2
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: pricebook2
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: pricebook_entry
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: account
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: opportunity
        config:
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 7, period: day}
          loaded_at_field: _loaded_at
      - name: opportunity_history
        config:
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 7, period: day}
          loaded_at_field: _loaded_at
      - name: opportunity_line_item
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness
      - name: quote
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness
      - name: quote_line_item
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness
      - name: order
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness
      - name: order_item
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness

  - name: billing
    description: Stripe-shaped billing objects. Amounts are minor units and currency codes are lowercase.
    meta:
      external_location: "{{ var('data_dir', env_var('GTM_DATA_DIR', flags.LOG_PATH.rsplit('/logs', 1)[0] ~ '/../data')) }}/raw/billing/{name}.csv"
    tables:
      - name: customer
        config:
          freshness: null  # reference/slow-moving table: freshness is enforced at the connector level
      - name: invoice
        config:
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 7, period: day}
          loaded_at_field: _loaded_at
      - name: invoice_line_item
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness
      - name: charge
        config:
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 7, period: day}
          loaded_at_field: _loaded_at
      - name: usage_record_summary
        config:
          freshness: null  # transactional child table: covered by parent-table row arrival + connector-level freshness

  - name: fivetran_log
    description: Hourly connector sync log. Both tables read the same file; freshness filters to one connector.
    tables:
      - name: salesforce_sync
        meta:
          external_location: "{{ var('data_dir', env_var('GTM_DATA_DIR', flags.LOG_PATH.rsplit('/logs', 1)[0] ~ '/../data')) }}/raw/fivetran_log/connector_sync.csv"
        config:
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
            filter: "connector_id = 'salesforce' and status = 'SUCCESSFUL'"
          loaded_at_field: sync_end
      - name: stripe_sync
        meta:
          external_location: "{{ var('data_dir', env_var('GTM_DATA_DIR', flags.LOG_PATH.rsplit('/logs', 1)[0] ~ '/../data')) }}/raw/fivetran_log/connector_sync.csv"
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "connector_id = 'stripe' and status = 'SUCCESSFUL'"
          loaded_at_field: sync_end
      - name: extract_clock
        description: One row, the generator's now. Freshness ages are measured against this clock.
        meta:
          external_location: "{{ var('data_dir', env_var('GTM_DATA_DIR', flags.LOG_PATH.rsplit('/logs', 1)[0] ~ '/../data')) }}/raw/fivetran_log/extract_clock.csv"
        config:
          freshness: null

  - name: story
    description: Planted story events the random extract cannot reconstruct, including Deal Desk items already cleared.
    meta:
      external_location: "{{ var('data_dir', env_var('GTM_DATA_DIR', flags.LOG_PATH.rsplit('/logs', 1)[0] ~ '/../data')) }}/raw/story/{name}.csv"
    tables:
      - name: deal_desk_exception
        description: Open and resolved Deal Desk exceptions.
        config:
          freshness: null
