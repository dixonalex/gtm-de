version: 2

models:
  - name: dq_connector_freshness
    description: >
      Last successful Salesforce and Stripe sync, aged from the build clock.
      PASS, WARN, and ERROR use the same windows as source freshness.
    columns:
      - name: connector_id
        data_tests: [unique, not_null]
      - name: as_of_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PASS', 'WARN', 'ERROR']

  - name: dq_account_review_queue
    description: >
      Review-tier pairs that do not yet have a steward decision. Ranked by the combined
      committed ARR of the two v2 billing masters at the warehouse as-of month, then by
      match_score (lower is closer). This queue does not set master_account_id.
    columns:
      - name: account_id_a
        data_tests: [not_null]
      - name: account_id_b
        data_tests: [not_null]
      - name: arr_at_stake_usd
        data_tests: [not_null]
      - name: queue_rank
        data_tests: [unique, not_null]

  - name: dq_backlog
    description: >
      Open data-quality exceptions, including ones older than the 7-day incident window.
      first_seen is _loaded_at for a late Salesforce row, CloseDate for Closed Won without
      an order, and LastModifiedDate for an amount mismatch. age_days is measured from the
      warehouse as-of date. usd_at_stake is null for arrival lag.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - exception_type
              - record_id
    columns:
      - name: exception_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - salesforce_arrival_lag
                  - closed_won_without_order
                  - closed_won_amount_line_mismatch
      - name: record_id
        data_tests: [not_null]
      - name: first_seen
        data_tests: [not_null]
      - name: age_days
        data_tests: [not_null]
