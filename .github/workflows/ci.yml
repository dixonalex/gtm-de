name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GTM_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Build the pinned story extract
        run: make AS_OF=2026-09-30 all

      - name: Story check
        run: make story-check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Page check
        run: make page-check

      - name: Export eval tables
        working-directory: dbt
        run: |
          uv run --project ${{ github.workspace }} python -c "
          import duckdb
          con = duckdb.connect('gtm.duckdb', read_only=True)
          con.execute(\"copy eval.eval_match_quality to 'eval_match_quality.csv' (header, delimiter ',')\")
          con.execute(\"copy eval.eval_match_misses to 'eval_match_misses.csv' (header, delimiter ',')\")
          con.close()
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          if-no-files-found: warn
          path: |
            dbt/target/run_results.json
            dbt/target/sources.json
            dbt/eval_match_quality.csv
            dbt/eval_match_misses.csv
