name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GTM_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Build the pinned story extract
        run: make AS_OF=2026-09-30 all

      - name: Story check
        run: make story-check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Page check
        run: |
          export CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          CI=true make page-check

      - name: Export eval tables
        working-directory: dbt
        run: |
          uv run --project ${{ github.workspace }} python -c "
          import duckdb
          con = duckdb.connect('gtm.duckdb', read_only=True)
          con.execute(\"copy eval.eval_match_quality to 'eval_match_quality.csv' (header, delimiter ',')\")
          con.execute(\"copy eval.eval_match_misses to 'eval_match_misses.csv' (header, delimiter ',')\")
          con.close()
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dbt-artifacts
          if-no-files-found: warn
          path: |
            dbt/target/run_results.json
            dbt/target/sources.json
            dbt/eval_match_quality.csv
            dbt/eval_match_misses.csv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pages-site
          path: dashboard/build/gtm-de

  deploy:
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: pages-site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
